name: CurioAxiom Facts Pipeline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/curioaxiom.yml"
      - "src/autopilot/facts.py"
      - "src/autopilot/pipeline.py"
      - "src/autopilot/cli.py"
      - "src/autopilot/config.py"
      - "src/autopilot/models.py"
      - "src/autopilot/quality.py"
      - "src/autopilot/discovery.py"
      - "src/autopilot/research.py"
      - "src/autopilot/render.py"
      - "src/autopilot/providers/llm.py"
      - "src/autopilot/providers/premium_planner.py"
      - "src/autopilot/providers/tts.py"
  schedule:
    - cron: "35 6 * * *"   # 12:05 Asia/Kolkata (Noon slot)
    - cron: "35 12 * * *"  # 18:05 Asia/Kolkata (Evening slot)
  workflow_dispatch:
    inputs:
      slot:
        description: "CurioAxiom production slot"
        required: false
        default: "evening"
        type: choice
        options: [morning, evening, all]
      topic:
        description: "Optional commissioning-test topic override"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: curioaxiom-facts-pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      CHANNEL_PROFILE: curioaxiom
      CHANNEL_DISPLAY_NAME: CurioAxiom
      EXPECTED_YOUTUBE_CHANNEL_ID: UCpddoAgL5DCidscCMx4WMHQ
      ARTIFACTS_DIR: artifacts/curioaxiom
      STATE_FILE: state/curioaxiom/history.json
      LEARNING_FILE: state/curioaxiom/learning.json
      CHANNEL_NICHE: verified cinematic facts across science, history, geography, mathematics, engineering, space, Formula 1 and automobiles
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.CURIOAXIOM_YOUTUBE_TOKEN_B64 }}
      YOUTUBE_TOKEN_FILE: secrets/youtube_token_curioaxiom.json
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      SHORTS_PUBLIC: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Determine production slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "35 6 * * *" ]; then
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
          else
            # Safe recovery for a reviewed push: quota checks prevent duplicates.
            echo "RUN_SLOT=evening" >> "$GITHUB_ENV"
          fi
          # User-approved October 10 recovery; normal daily limits resume afterward.
          if [ "$(TZ=Asia/Kolkata date +%F)" = "2026-10-10" ]; then
            echo "SHORTS_PER_DAY=4" >> "$GITHUB_ENV"
            echo "RUN_SLOT=all" >> "$GITHUB_ENV"
          fi
      - name: Preflight isolated CurioAxiom secrets
        shell: bash
        run: |
          if { [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; } || [ -z "$YOUTUBE_CLIENT_SECRETS_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "CurioAxiom OAuth is not configured; safely skipping."
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi
      - name: Install production dependencies
        if: env.READY == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
      - name: Restore CurioAxiom OAuth only
        if: env.READY == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token_curioaxiom.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY
      - name: Verify CurioAxiom OAuth and channel identity (transient API retry)
        if: env.READY == 'true'
        run: python -m autopilot.cli verify-youtube
      - name: Produce verified facts (public Shorts & alternate-day Longs)
        if: env.READY == 'true'
        shell: bash
        env:
          TEST_TOPIC: ${{ inputs.topic }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Production attempt $attempt of 3 for slot: $RUN_SLOT"
            if [ -n "$TEST_TOPIC" ]; then
              python -m autopilot.cli run --topic "$TEST_TOPIC" --format short --render
            else
              python -m autopilot.cli daily --live --slot "$RUN_SLOT"
            fi
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "CurioAxiom production completed successfully on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying after 20 seconds."
              sleep 20
            fi
          done
          echo "All CurioAxiom production attempts failed."
          exit 1
      - name: Persist CurioAxiom state only
        if: always() && env.READY == 'true'
        shell: bash
        run: |
          git config user.name "curioaxiom-autopilot-bot"
          git config user.email "curioaxiom-autopilot-bot@users.noreply.github.com"
          git add state/curioaxiom/history.json state/curioaxiom/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update CurioAxiom learning state [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Upload CurioAxiom artifacts
        if: always() && env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: curioaxiom-${{ github.run_id }}
          path: artifacts/curioaxiom/
          retention-days: 7
