name: Replace Duplicate Short

on:
  push:
    paths:
      - ".github/workflows/repair-duplicate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bytevexa-duplicate-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Attempt to delete newest duplicate upload
        continue-on-error: true
        run: |
          python - <<'PY'
          from autopilot.config import Settings
          from autopilot.youtube import YouTubeUploader
          settings = Settings()
          uploader = YouTubeUploader(settings)
          uploads = uploader.recent_uploads(limit=8)
          if not uploads:
              raise RuntimeError('No channel uploads found; refusing to guess a video ID.')
          latest = uploads[0]
          print(f"Attempting to delete newest upload: {latest['title']} ({latest['video_id']})")
          uploader.delete_video(latest['video_id'])
          print('Newest duplicate upload deleted successfully.')
          PY

      - name: Produce fresh replacement public Short
        run: >-
          python -m autopilot.cli run
          --format short
          --render
          --topic "Alibaba Wan3.0 AI video model: what changed, how creators can use it, and one limitation to know"

      - name: Persist repaired history
        shell: bash
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "youtube-autopilot-bot@users.noreply.github.com"
          git add state/history.json state/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist replacement upload history [skip ci]"
            git push
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bytevexa-duplicate-repair-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
