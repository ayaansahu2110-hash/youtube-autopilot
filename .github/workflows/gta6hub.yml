name: GTA6Hub Autopilot

on:
  schedule:
    # 10 uploads per day across 5 cron slots (morning through night IST)
    # IST = UTC+5:30 | Slots: 7:00, 10:30, 13:00, 16:00, 19:00, 21:00 IST
    - cron: "30 1 * * *"   # 07:00 IST  — slot A (1 short + 1 long)
    - cron: "0  5 * * *"   # 10:30 IST  — slot B (2 shorts)
    - cron: "30 7 * * *"   # 13:00 IST  — slot C (2 shorts)
    - cron: "30 10 * * *"  # 16:00 IST  — slot D (2 shorts)
    - cron: "30 13 * * *"  # 19:00 IST  — slot E (1 short + 1 long)
    - cron: "30 15 * * *"  # 21:00 IST  — slot F (2 shorts — bonus)
  workflow_dispatch:
    inputs:
      slot:
        description: "GTA6Hub production slot"
        required: false
        default: "evening"
        type: choice
        options:
          - morning
          - evening
          - all
          - boost
      topic:
        description: "Optional manual topic override (e.g. 'GTA 6 Easter egg in Leonida map')"
        required: false
        default: ""
        type: string
      count:
        description: "Number of videos to produce in this run (1-5)"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: gta6hub-autopilot-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHANNEL_PROFILE: gta6hub
      CHANNEL_DISPLAY_NAME: GTA6Hub
      EXPECTED_YOUTUBE_CHANNEL_ID: ${{ secrets.GTA6HUB_CHANNEL_ID }}
      ARTIFACTS_DIR: artifacts/gta6hub
      STATE_FILE: state/gta6hub/history.json
      LEARNING_FILE: state/gta6hub/learning.json
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.GTA6HUB_YOUTUBE_TOKEN_B64 }}
      YOUTUBE_TOKEN_FILE: secrets/youtube_token_gta6hub.json
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      SHORTS_PUBLIC: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata
      # GTA6Hub-specific: daily long-form enabled on every slot with long
      LONGFORM_ENABLED: "true"
      LONGFORM_EVERY_DAYS: "1"
      LONGFORM_ANCHOR_DATE: "2026-11-19"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine production slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=${{ inputs.slot || 'evening' }}" >> "$GITHUB_ENV"
            echo "MANUAL_COUNT=${{ inputs.count || '2' }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
            echo "MANUAL_COUNT=2" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "RUN_SLOT=evening" >> "$GITHUB_ENV"
            echo "MANUAL_COUNT=2" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
            echo "MANUAL_COUNT=2" >> "$GITHUB_ENV"
          fi

      - name: Preflight secrets
        shell: bash
        run: |
          if { [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; } || \
             [ -z "$YOUTUBE_CLIENT_SECRETS_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "::warning::GTA6Hub secrets not configured; safely skipping."
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: Install FFmpeg
        if: env.READY == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        if: env.READY == 'true'
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        if: env.READY == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        if: env.READY == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path(os.environ['YOUTUBE_TOKEN_FILE']).write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Verify OAuth and channel identity
        if: env.READY == 'true'
        run: python -m autopilot.cli verify-youtube

      - name: Produce GTA6Hub videos with retry
        if: env.READY == 'true'
        shell: bash
        env:
          TEST_TOPIC: ${{ inputs.topic }}
        run: |
          set +e
          SLOT="$RUN_SLOT"
          COUNT="${MANUAL_COUNT:-2}"

          if [ -n "$TEST_TOPIC" ]; then
            # Manual topic override — produce one short and one long
            echo "=== Producing manual topic: $TEST_TOPIC ==="
            for attempt in 1 2 3; do
              python -m autopilot.cli run --topic "$TEST_TOPIC" --format short --render
              code=$?
              [ "$code" -eq 0 ] && break
              [ "$attempt" -lt 3 ] && sleep 20
            done
            for attempt in 1 2 3; do
              python -m autopilot.cli run --topic "$TEST_TOPIC" --format long --render
              code=$?
              [ "$code" -eq 0 ] && break
              [ "$attempt" -lt 3 ] && sleep 20
            done
          elif [ "$SLOT" = "boost" ]; then
            # Boost mode: produce 5 shorts back-to-back
            echo "=== BOOST MODE: 5 shorts ==="
            for i in 1 2 3 4 5; do
              echo "--- Boost short $i of 5 ---"
              for attempt in 1 2 3; do
                python -m autopilot.cli run --format short --render
                code=$?
                [ "$code" -eq 0 ] && break
                [ "$attempt" -lt 3 ] && sleep 15
              done
            done
          else
            # Standard scheduled run: produce N videos per slot
            echo "=== Scheduled slot: $SLOT | count: $COUNT ==="
            python -m autopilot.cli daily --live --slot "$SLOT"
            exit_code=$?

            # If count > 2, produce additional shorts
            if [ "$COUNT" -gt 2 ]; then
              extra=$((COUNT - 2))
              echo "=== Producing $extra additional GTA6Hub shorts ==="
              for i in $(seq 1 $extra); do
                echo "--- Extra short $i ---"
                for attempt in 1 2 3; do
                  python -m autopilot.cli run --format short --render
                  code=$?
                  [ "$code" -eq 0 ] && break
                  [ "$attempt" -lt 3 ] && sleep 15
                done
              done
            fi
            exit $exit_code
          fi

      - name: Persist state
        if: always() && env.READY == 'true'
        shell: bash
        run: |
          git config user.name "gta6hub-autopilot-bot"
          git config user.email "gta6hub-autopilot-bot@users.noreply.github.com"
          git add state/gta6hub/history.json state/gta6hub/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GTA6Hub history [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload run artifacts
        if: always() && env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gta6hub-${{ github.run_id }}
          path: |
            artifacts/gta6hub/**/manifest.json
            artifacts/gta6hub/**/*.srt
          retention-days: 7
