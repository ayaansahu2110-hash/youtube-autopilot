name: ByteVexa Long-Form Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/long-test.yml"

permissions:
  contents: read

concurrency:
  group: bytevexa-long-test
  cancel-in-progress: true

jobs:
  produce-long-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "private"
      ALLOW_PUBLIC_UPLOADS: "false"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Produce private 8-12 minute long-form test
        run: python -m autopilot.cli run --format long --render

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bytevexa-long-test-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
