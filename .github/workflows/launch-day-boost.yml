name: ByteVexa Launch Day Boost

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launch-day-boost.yml"

permissions:
  contents: write

concurrency:
  group: bytevexa-launch-day-boost
  cancel-in-progress: false

jobs:
  extra-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Produce first extra public Short
        run: python -m autopilot.cli run --format short --render

      - name: Produce second extra public Short
        run: python -m autopilot.cli run --format short --render

      - name: Persist launch-day history
        shell: bash
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "youtube-autopilot-bot@users.noreply.github.com"
          git add state/history.json state/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist launch-day boost history [skip ci]"
            git push
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bytevexa-launch-day-boost-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
