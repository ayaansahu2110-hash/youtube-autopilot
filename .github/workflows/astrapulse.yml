name: AstraPulse Autopilot

on:
  schedule:
    - cron: "5 7 * * *"   # 12:35 Asia/Kolkata (Noon slot)
    - cron: "5 13 * * *"  # 18:35 Asia/Kolkata (Evening slot)
  workflow_dispatch:
    inputs:
      slot:
        description: "AstraPulse production slot"
        required: false
        default: "evening"
        type: choice
        options:
          - morning
          - evening
          - all
      topic:
        description: "Optional commissioning-test topic override"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: astrapulse-autopilot
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      CHANNEL_PROFILE: astrapulse
      CHANNEL_DISPLAY_NAME: AstraPulse
      EXPECTED_YOUTUBE_CHANNEL_ID: UC9-C8N7q2m8nax0kYWFy9og
      ARTIFACTS_DIR: artifacts/astrapulse
      STATE_FILE: state/astrapulse/history.json
      LEARNING_FILE: state/astrapulse/learning.json
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.ASTRAPULSE_YOUTUBE_TOKEN_B64 }}
      YOUTUBE_TOKEN_FILE: secrets/youtube_token_astrapulse.json
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      SHORTS_PUBLIC: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine production slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "5 7 * * *" ]; then
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=evening" >> "$GITHUB_ENV"
          fi

      - name: Preflight secrets
        shell: bash
        run: |
          if { [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; } || [ -z "$YOUTUBE_CLIENT_SECRETS_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "AstraPulse secrets not configured; safely skipping."
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: Install FFmpeg
        if: env.READY == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        if: env.READY == 'true'
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        if: env.READY == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        if: env.READY == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path(os.environ['YOUTUBE_TOKEN_FILE']).write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Verify OAuth and channel identity
        if: env.READY == 'true'
        run: python -m autopilot.cli verify-youtube

      - name: Produce scheduled videos with retry
        if: env.READY == 'true'
        shell: bash
        env:
          TEST_TOPIC: ${{ inputs.topic }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Production attempt $attempt of 3 for slot: $RUN_SLOT"
            if [ -n "$TEST_TOPIC" ]; then
              python -m autopilot.cli run --topic "$TEST_TOPIC" --format short --render
            else
              python -m autopilot.cli daily --live --slot "$RUN_SLOT"
            fi
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "AstraPulse production completed successfully on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying after 20 seconds."
              sleep 20
            fi
          done
          echo "All AstraPulse production attempts failed."
          exit 1

      - name: Persist state
        if: always() && env.READY == 'true'
        shell: bash
        run: |
          git config user.name "astrapulse-autopilot-bot"
          git config user.email "astrapulse-autopilot-bot@users.noreply.github.com"
          git add state/astrapulse/history.json state/astrapulse/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AstraPulse history [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload run artifacts
        if: always() && env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: astrapulse-${{ github.run_id }}
          path: artifacts/astrapulse/
          retention-days: 7

