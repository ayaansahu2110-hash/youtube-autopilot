name: Daily YouTube Autopilot

on:
  push:
    paths:
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "30 6 * * *"  # 12:00 Asia/Kolkata
    - cron: "30 12 * * *" # 18:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      slot:
        description: "Production slot"
        required: false
        default: "evening"
        type: choice
        options:
          - morning
          - evening
          - all

permissions:
  contents: write

concurrency:
  group: youtube-autopilot-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      EXPECTED_YOUTUBE_CHANNEL_ID: UC09G9D1CBuQBBWa7ZY8fRnQ
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      AUTOPILOT_ENV: production
      MANUAL_TOPIC_SOURCES: "https://www.photopea.com/,https://www.photopea.com/,https://www.photopea.com/learn/"
      MANUAL_TOPIC_EVIDENCE: "Photopea’s official website says it is a free online photo editor that runs in the browser without downloads, keeps files on the device, and includes layers, masks, cropping, resizing, blending, adjustments and filters. It says users can start editing without spending money. Do not claim features, prices, or account requirements beyond these statements."
      SCHEDULE_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine production slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=evening" >> "$GITHUB_ENV"
          fi

      - name: Preflight secrets
        shell: bash
        run: |
          if { [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; } || [ -z "$YOUTUBE_CLIENT_SECRETS_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "Required AI/YouTube secrets are not configured yet; safely skipping production."
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: Install FFmpeg
        if: env.READY == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        if: env.READY == 'true'
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        if: env.READY == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        if: env.READY == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Verify ByteVexa OAuth before production
        if: env.READY == 'true'
        run: python -m autopilot.cli verify-youtube

      - name: Produce one verified Photopea walkthrough with retry
        if: env.READY == 'true'
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Photopea walkthrough attempt $attempt of 3"
            python -m autopilot.cli run --render --format short --topic "Photopea: create a browser project without an account"
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "One verified walkthrough published successfully on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying after 20 seconds with fresh model output."
              sleep 20
            fi
          done
          echo "All walkthrough attempts failed."
          exit 1

      - name: Persist topic, analytics and learning history
        if: always() && env.READY == 'true'
        shell: bash
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "youtube-autopilot-bot@users.noreply.github.com"
          git add state/history.json state/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update autopilot learning history [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload run artifacts for debugging
        if: always() && env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
