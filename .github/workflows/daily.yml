name: Daily YouTube Autopilot

on:
  schedule:
    - cron: "30 6 * * *"  # 12:00 Asia/Kolkata
    - cron: "30 12 * * *" # 18:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      slot:
        description: "Production slot"
        required: false
        default: "evening"
        type: choice
        options:
          - morning
          - evening
          - all

permissions:
  contents: write

concurrency:
  group: youtube-autopilot-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      ENABLE_UPLOADS: "true"
      UPLOAD_PRIVACY_STATUS: "public"
      ALLOW_PUBLIC_UPLOADS: "true"
      AUTOPILOT_ENV: production
      SCHEDULE_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine production slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=evening" >> "$GITHUB_ENV"
          fi

      - name: Preflight secrets
        shell: bash
        run: |
          if { [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; } || [ -z "$YOUTUBE_CLIENT_SECRETS_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "Required AI/YouTube secrets are not configured yet; safely skipping production."
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: Install FFmpeg
        if: env.READY == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project
        if: env.READY == 'true'
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install browser capture engine
        if: env.READY == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore OAuth files
        if: env.READY == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path('secrets/client_secret.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_CLIENT_SECRETS_B64']))
          pathlib.Path('secrets/youtube_token.json').write_bytes(base64.b64decode(os.environ['YOUTUBE_TOKEN_B64']))
          PY

      - name: Produce scheduled videos
        if: env.READY == 'true'
        run: python -m autopilot.cli daily --live --slot "$RUN_SLOT"

      - name: Persist topic, analytics and learning history
        if: env.READY == 'true'
        shell: bash
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "youtube-autopilot-bot@users.noreply.github.com"
          git add state/history.json state/learning.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update autopilot learning history [skip ci]"
            git push
          fi

      - name: Upload run artifacts for debugging
        if: always() && env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
