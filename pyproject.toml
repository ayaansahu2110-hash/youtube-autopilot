[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-autopilot"
version = "0.3.0"
description = "Original-content YouTube automation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.13,<5",
  "edge-tts>=7,<8",
  "feedparser>=6.0,<7",
  "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "openai>=1.100,<2",
  "pillow>=11,<12",
  "playwright>=1.55,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
youtube-autopilot = "autopilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Keep CI focused on correctness-oriented linting. The production pipeline intentionally
# uses a few broad fail-safe exception boundaries and supports Python 3.11 syntax.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"src/autopilot/providers/hybrid_visuals.py" = ["F841"]
